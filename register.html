<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <h1>Buat akun baru</h1>
    <p class="subtitle">Isi data di bawah untuk mendaftar</p>

    <div class="error" id="errorBox">Terjadi kesalahan. Periksa kembali data Anda.</div>

    <form id="registerForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="nama@email.com" required>
      </div>

      <div class="field">
        <label for="password">Kata Sandi</label>
        <div class="password-wrapper">
          <input type="password" id="password" placeholder="Minimal 6 karakter" required>
          <button type="button" class="toggle-password" data-target="password" aria-label="Toggle password visibility">
            <!-- SVG Mata Terbuka Baru -->
            <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
            </svg>
          </button>
        </div>
        <p class="hint">Gunakan kombinasi huruf dan angka.</p>
      </div>

      <div class="field">
        <label for="confirmPassword">Konfirmasi Kata Sandi</label>
        <div class="password-wrapper">
          <input type="password" id="confirmPassword" placeholder="Ulangi kata sandi" required>
          <button type="button" class="toggle-password" data-target="confirmPassword" aria-label="Toggle password visibility">
            <!-- SVG Mata Terbuka Baru -->
            <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="submit" id="submitBtn">Daftar</button>
    </form>

    <p class="footer-text">Sudah punya akun? <a href="index.html">Masuk</a></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
