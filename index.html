<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <h1>Selamat datang kembali</h1>
    <p class="subtitle">Masuk untuk melanjutkan ke akun Anda</p>

    <div class="error" id="errorBox">Email atau kata sandi salah.</div>

    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="nama@email.com" required>
      </div>

      <div class="field">
        <label for="password">Kata Sandi</label>
        <div class="password-wrapper">
          <input type="password" id="password" placeholder="Masukkan kata sandi" required>
          <button type="button" class="toggle-password" data-target="password">👁️</button>
        </div>
      </div>

      <div class="row">
        <label>
          <input type="checkbox" id="remember">
          Ingat saya
        </label>
        <a href="#">Lupa kata sandi?</a>
      </div>

      <button type="submit" class="submit">Masuk</button>
    </form>

    <p class="footer-text">Belum punya akun? <a href="register.html">Daftar</a></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
